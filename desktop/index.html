<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeriBaari</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#64748b">
        Starting MeriBaari…
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || root.getAttribute('data-booted')) return;
        var message =
          (event.error && event.error.stack) ||
          event.message ||
          'Unknown startup error';
        root.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif">' +
          '<div style="max-width:640px"><h1 style="margin:0 0 12px;font-size:20px">MeriBaari failed to start</h1>' +
          '<pre style="white-space:pre-wrap;color:#b91c1c;font-size:12px">' +
          String(message).replace(/[<>&]/g, function (c) {
            return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
          }) +
          '</pre></div></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
